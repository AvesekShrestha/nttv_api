[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ntc-notification-service"
version = "0.1.0"
description = "Notification microservice for the NTC Ticket Management System"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.1.2",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.3.6",
    "confluent-kafka>=2.16.0",
    "pydantic[email]>=2.13.5",
    "aiosmtplib>=5.1.3",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
