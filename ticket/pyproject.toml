[project]
name = "ticket"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Avesek", email = "avesekxthaa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "confluent-kafka>=2.16.0",
    "dependency-injector>=4.49.1",
    "dotenv>=0.9.9",
    "fastapi>=0.143.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ticket = "ticket:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
